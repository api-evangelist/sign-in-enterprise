openapi: 3.2.0
info:
  title: Sign In Solutions VMS Email Templates API
  version: 0.21.0
  x-logo:
    url: https://signinenterprise.com/wp-content/uploads/tg-logo-light@2.png
    backgroundColor: '#FFFFFF'
    altText: Sign In Solutions
    href: https://signinsolutions.com/signinenterprise
  description: The Traction Guest API is currently under limited release to select customers as we gather and iterate on feedback.
  contact:
    name: API Support
    url: https://signinsolutions.com/signinenterprise
    email: support@tractionguest.com
servers:
- url: '{domain}'
  variables:
    domain:
      enum:
      - https://us.tractionguest.com/api/v3
      - http://localhost:3000/api/v3
      default: https://us.tractionguest.com/api/v3
security:
- TractionGuestAuth:
  - all
  - openid
  - admin:webhooks
  - watchlists:*
  - watchlists:read
  - watchlists:write
  - users:*
  - users:read
  - users:write
  - visitors:*
  - visitors:read
  - visitors:write
  - parking:*
  - parking:read
  - parking:write
  - locations:*
  - locations:read
  - locations:write
  - hosts:*
  - hosts:read
  - hosts:write
  - email_templates:*
  - email_templates:read
  - email_templates:write
tags:
- name: Email Templates
  description: All endpoints relating to operations for the EmailTemplate model
paths:
  /email_templates:
    summary: Path used to manage the list of EmailTemplates.
    description: The REST endpoint/path used to list zero or more `EmailTemplate` entities.  This path contains a `GET` operation to perform the list task.
    get:
      tags:
      - Email Templates
      parameters:
      - name: limit
        description: Limits the results to a specified number, defaults to 50
        schema:
          type: integer
        in: query
      - name: offset
        description: Offsets the results to a specified number, defaults to 0
        schema:
          type: integer
        in: query
      - name: include
        description: A list of comma-separated related models to include
        schema:
          type: string
        in: query
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./models/PaginatedEmailTemplatesList.v1.yaml
              examples:
                default:
                  value:
                    email_templates:
                    - id: 58
                      name: some text
                      template_type: some text
                    - id: 90
                      name: some text
                      template_type: some text
                    pagination:
                      total_records: 84
                      current_offset: 99
                      next_offset: 45
          description: Successful response - returns an array of `EmailTemplate` entities.
        '400':
          content:
            application/json:
              schema:
                $ref: ./models/ErrorsList.v1.yaml
              examples:
                default:
                  value:
                    errors:
                    - domain: some text
                      attribute: some text
                      code: some text
                      message: some text
                    - domain: some text
                      attribute: some text
                      code: some text
                      message: some text
          description: A generic error
        '401':
          description: You don't have permission to view this EmailTemplate
        '403':
          description: You do not have permission for this action
      operationId: getEmailTemplates
      summary: List all EmailTemplates
      description: Gets a list of all `EmailTemplate` entities.
components:
  securitySchemes:
    TractionGuestAuth:
      openIdConnectUrl: https://us.tractionguest.com/.well-known/openid-configuration
      type: openIdConnect
