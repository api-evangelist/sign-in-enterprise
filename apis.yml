aid: sign-in-enterprise
name: Sign In Enterprise
description: 'Sign In Enterprise (formerly Traction Guest, now part of Sign In Solutions)
  is an enterprise visitor management system (VMS) used by security-conscious organizations
  in aerospace and defense, government, manufacturing, pharmaceuticals, and technology.
  Its REST API — branded "Guest Connect" and published as the Sign In Solutions VMS API —
  lets developers retrieve and modify visitor and employee sign-in data to extend workflows:
  managing hosts, invites, sign-ins, registrations, locations, capacities, parking, group
  visits, watchlists, email templates, and audit logs. The API is REST over JSON, secured
  with OAuth 2.0 / OpenID Connect scoped access, and supports idempotent writes via an
  Idempotency-Key header.'
